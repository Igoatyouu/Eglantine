name: macos-release

# Keeps nx2 and the tags in step with Djihads80/Eglantine, and builds a macOS app of each new
# upstream release into a release of this repository under the same tag.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream release tag to build (empty = the newest upstream release)
        type: string
        default: ""
      force:
        description: Build again even if this repository already has that release
        type: boolean
        default: false

permissions:
  contents: write

# One run at a time, never cancelled: a release that is building finishes and publishes.
concurrency:
  group: macos-release
  cancel-in-progress: false

env:
  UPSTREAM: Djihads80/Eglantine
  UPSTREAM_BRANCH: nx2

jobs:
  sync:
    name: Sync upstream and pick a release
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.pick.outputs.build }}
      tag: ${{ steps.pick.outputs.tag }}
      sha: ${{ steps.pick.outputs.sha }}
      prerelease: ${{ steps.pick.outputs.prerelease }}
      title: ${{ steps.pick.outputs.title }}
    steps:
      # GITHUB_TOKEN cannot push commits that change upstream's .github/workflows, so the push needs
      # SYNC_TOKEN (a token with the Contents and Workflows permissions on this repository). Without
      # it the sync is skipped and the build still runs: the fork network holds upstream's commits.
      - name: Mirror nx2 and tags
        continue-on-error: true
        shell: bash
        env:
          TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ]; then
            echo "::warning::SYNC_TOKEN is not set: nx2 and the tags are not mirrored (the macOS build still runs)"
            exit 0
          fi
          git init -q mirror && cd mirror
          git fetch -q --tags "https://github.com/${UPSTREAM}.git" "+refs/heads/${UPSTREAM_BRANCH}:refs/remotes/upstream/${UPSTREAM_BRANCH}"
          origin="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Fast-forward only: a fork branch that diverged from upstream is reported, not overwritten.
          git push -q "$origin" "refs/remotes/upstream/${UPSTREAM_BRANCH}:refs/heads/${UPSTREAM_BRANCH}"
          git push -q "$origin" --tags
          echo "nx2 at $(git rev-parse --short "upstream/${UPSTREAM_BRANCH}"), $(git tag | wc -l) tags"

      - name: Pick the release to build
        id: pick
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ inputs.tag }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [ -n "$WANT" ]; then
            rel=$(gh api "repos/${UPSTREAM}/releases/tags/${WANT}")
          else
            # The newest release, pre-releases included (upstream publishes builds as pre-releases).
            rel=$(gh api "repos/${UPSTREAM}/releases?per_page=1" --jq '.[0]')
          fi
          tag=$(jq -r .tag_name <<< "$rel")
          sha=$(gh api "repos/${UPSTREAM}/commits/${tag}" --jq .sha)
          {
            echo "tag=$tag"
            echo "sha=$sha"
            echo "prerelease=$(jq -r .prerelease <<< "$rel")"
            echo "title=$(jq -r .name <<< "$rel")"
          } >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 && [ "$FORCE" != "true" ]; then
            echo "$tag is already released here: nothing to build"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "building $tag (${sha::7})"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: macOS arm64 app
    needs: sync
    if: needs.sync.outputs.build == 'true'
    runs-on: macos-15
    timeout-minutes: 240
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3000M
    steps:
      - name: Check out upstream ${{ needs.sync.outputs.tag }}
        uses: actions/checkout@v5
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ needs.sync.outputs.sha }}

      - name: Check out this repository's patches
        uses: actions/checkout@v5
        with:
          path: .macos-ci

      # A patch upstream already has is skipped; one that no longer applies is reported and skipped,
      # so a change on their side does not stop the release.
      - name: Apply patches
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for p in .macos-ci/patches/*.patch; do
            if git apply --check "$p" 2> /dev/null; then
              git apply "$p"; echo "applied $(basename "$p")"
            elif git apply --check -R "$p" 2> /dev/null; then
              echo "::notice::$(basename "$p") is already upstream"
            else
              echo "::warning::$(basename "$p") no longer applies: skipped"
            fi
          done
          rm -rf .macos-ci

      # The packages docs/Deps.md lists for macOS, plus ccache (as upstream's release-binaries.yml).
      - name: Install dependencies
        shell: bash
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew install autoconf automake boost ffmpeg fmt glslang hidapi libtool libusb lz4 ninja \
            nlohmann-json openssl pkg-config qt@6 sdl3 speexdsp zlib zstd cmake catch2 molten-vk \
            vulkan-loader spirv-tools vulkan-utility-libraries ccache

      - name: Cache CPM downloads
        uses: actions/cache@v5
        with:
          path: .cache/cpm
          key: cpm-macos-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'src/**/CMakeLists.txt') }}
          restore-keys: |
            cpm-macos-

      - name: Cache compiler objects
        uses: actions/cache@v5
        with:
          path: .ccache
          key: objects-macos-arm64-${{ needs.sync.outputs.sha }}
          restore-keys: |
            objects-macos-arm64-

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DYUZU_TESTS=OFF \
            -DYUZU_CMD=ON \
            -DYUZU_ROOM=OFF \
            -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_USE_BUNDLED_QT=OFF \
            "-DCMAKE_PREFIX_PATH=$(brew --prefix qt@6);$(brew --prefix zlib)" \
            "-DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" \
            -DVulkanHeaders_FORCE_BUNDLED=ON \
            -DVulkanUtilityLibraries_FORCE_BUNDLED=ON \
            -DENABLE_UPDATE_CHECKER=OFF \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DUSE_CCACHE=ON

      - name: Build
        shell: bash
        run: |
          cmake --build build/release --target yuzu yuzu-cmd --parallel
          ccache --show-stats

      # As upstream's release-binaries.yml: Qt and Homebrew libraries copied into the bundle, every
      # reference outside it removed, then an ad-hoc signature.
      - name: Package app
        shell: bash
        run: |
          set -euo pipefail
          app=build/release/bin/eglantine.app
          test -x "$app/Contents/MacOS/eglantine"
          test -x build/release/bin/eden-cli
          cp build/release/bin/eden-cli "$app/Contents/MacOS/eden-cli"
          "$(brew --prefix qt@6)/bin/macdeployqt" "$app" \
            -executable="$app/Contents/MacOS/eden-cli" -libpath="$(brew --prefix)/lib" \
            -always-overwrite -verbose=1
          rm -f "$app/Contents/PlugIns/platforminputcontexts/libqtvirtualkeyboardplugin.dylib"
          binaries=$(find "$app/Contents" -type f \( -perm -u+x -o -name '*.dylib' \) \
            -exec sh -c 'file -b "$1" | grep -q Mach-O' _ {} \; -print)
          for binary in $binaries; do
            otool -l "$binary" | awk '/cmd LC_RPATH/ {getline; getline; print $2}' |
              { grep -E '^/(opt/homebrew|usr/local)/' || true; } | while read -r rpath; do
                install_name_tool -delete_rpath "$rpath" "$binary" 2> /dev/null
              done
          done
          for program in eglantine eden-cli; do
            install_name_tool -add_rpath @executable_path/../Frameworks \
              "$app/Contents/MacOS/$program" 2> /dev/null
          done
          leaks=$(for binary in $binaries; do
            otool -L "$binary" | grep -E '^\s+/(opt/homebrew|usr/local)/'
            otool -l "$binary" | awk '/cmd LC_RPATH/ {getline; getline; print $2}' |
              grep -E '^/(opt/homebrew|usr/local)/'
          done || true)
          if [ -n "$leaks" ]; then
            echo "References still pointing outside the bundle:"
            echo "$leaks" | sort -u
            exit 1
          fi
          codesign --force --deep --sign - "$app"
          if [ -f dist/eglantine.entitlements ]; then
            codesign --force --sign - --entitlements dist/eglantine.entitlements \
              "$app/Contents/MacOS/eden-cli"
            codesign --force --sign - --entitlements dist/eglantine.entitlements "$app"
          fi
          codesign --verify --deep --strict "$app"
          mkdir -p out
          ditto -c -k --keepParent "$app" out/eglantine-macos-arm64.zip
          dmgdir=$(mktemp -d)
          ditto "$app" "$dmgdir/eglantine.app"
          ln -s /Applications "$dmgdir/Applications"
          hdiutil create -volname "Eglantine" -srcfolder "$dmgdir" -ov -format UDZO out/eglantine-macos-arm64.dmg
          ls -la out

      # Zipped with ditto beforehand: the bundle's framework symlinks don't survive artifact zipping.
      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          name: eglantine-macos-arm64
          path: out/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish release
    needs: [sync, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Download app
        uses: actions/download-artifact@v7
        with:
          name: eglantine-macos-arm64
          path: out

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.sync.outputs.tag }}
          SHA: ${{ needs.sync.outputs.sha }}
          PRERELEASE: ${{ needs.sync.outputs.prerelease }}
          TITLE: ${{ needs.sync.outputs.title }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          macOS build of upstream release [${TAG}](https://github.com/${UPSTREAM}/releases/tag/${TAG}) (${TITLE}), commit ${UPSTREAM}@${SHA}, made by this repository's \`macos-release\` workflow with the patches in its \`macos-ci\` branch.

          Apple Silicon, macOS 15 or newer. Not notarized: right-click the app and choose Open the first time, or run \`xattr -dr com.apple.quarantine eglantine.app\`. \`eden-cli\` is inside the app, in \`Contents/MacOS\`.
          EOF
          flags=()
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" out/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --target "$SHA" "${flags[@]}" \
              --title "Eglantine macOS ${TAG} (${SHA::7})" --notes-file notes.md
          fi
